# Nightly wide-net simulation soak (docs/05-simulation-test.md §6):
# the per-commit suite runs one golden seed; this sweeps 25 seeds under the
# two stress configurations that don't fit the suite budget. npm ci installs
# the single runtime dependency (ws, for the phase-3 server tests); the
# browser e2e self-skips without the Playwright cache.
name: nightly-soak

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    # 35, raised from 20 on 2026-08-12. Measured, not waved: the 2026-08-11
    # main run's suite step took 19m15s at 1048 tests — 45s under the wire —
    # and dev_night's 1063-test suite (graphics-levels + ui additions) tipped
    # over it, so both dispatched runs were CANCELLED mid-suite with no
    # failing assertion (the same tree is 1062/1063 green locally). The
    # excess is suite growth; 35 leaves the same ~40% headroom 20 had when
    # the budget was set.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install lune (Luau twin gates — test/luau-twins self-skips without it)
        run: |
          curl -fsSL -o /tmp/lune.zip https://github.com/lune-org/lune/releases/download/v0.10.5/lune-0.10.5-linux-x86_64.zip
          unzip -o /tmp/lune.zip -d /tmp/lune-bin
          chmod +x /tmp/lune-bin/lune
          echo /tmp/lune-bin >> "$GITHUB_PATH"
      - name: Install headless chromium (browser UI cases self-skip without it — user-approved tier 1, 2026-07-14)
        run: npx --yes playwright install --with-deps chromium-headless-shell
      - name: Full test suite (incl. golden-seed simulation + Luau anchor gates)
        run: node --test test/
      - name: Visual-regression goldens (A48 — byte-compare rest-pose shots)
        if: ${{ !cancelled() }}
        run: debugging/visual-check.sh
      - name: Upload visual diffs (actual + golden) on mismatch
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-goldens
          path: debugging/goldens/
          if-no-files-found: ignore

  soak:
    runs-on: ubuntu-latest
    # 120, raised from 45 on 2026-08-03. The W6-W8 doctrine windows made late-game
    # states far denser (the sim-runner measured 886-2826 ms/turn on large
    # no-chaos states, ~15-20x the old calibration), so this job began exceeding
    # 45 min and being CANCELLED — which reads in the run list as a failure with
    # no failing assertion. Raising the natural soak to its correct 600 turns
    # adds to that. If this budget is hit again, the answer is to split the two
    # soaks into separate jobs, not to shorten the runs.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: God-Emperor soak — 25 seeds, 400 turns under contentCitizens 2
        run: node tools/soak.js --seeds 25 --turns 400 --size small --difficulty godemperor --stats debugging/sim/nightly-godemperor.jsonl
      - name: Natural-rules soak — 25 seeds must each produce a winner
        if: ${{ !cancelled() }}
        # 600, not 400 (corrected 2026-08-03). The comment this replaces said
        # the calendar puts 2100 AD at ~turn 395 — true when it was written,
        # stale since the calendar moved: GOLDEN_NATURAL in simulation.test.js
        # pins the score victory at round 545. A 400-turn budget therefore
        # CANNOT reach it, so every natural seed reported "NO VICTORY by turn
        # 400" and the nightly failed every night on a manufactured finding.
        # specs/measurement-program.md §6 already documented this exact artifact
        # (#2823) and mandated --turns 600; CI had not been updated to match.
        run: node tools/soak.js --seeds 25 --turns 600 --size small --natural --stats debugging/sim/nightly-natural.jsonl
      - name: Upload telemetry + failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-sim
          path: debugging/sim/
          if-no-files-found: ignore

  canonical-floors:
    # The user-pinned M-target FLOORS (docs/05 §12) are defined on the CANONICAL
    # config — 7-civ medium no-chaos normal — which the two soak lanes above do
    # NOT run (they are small + godemperor/natural). This lane runs it and
    # tools/soak.js --stats prints the floor table (A93).
    #
    # RATCHET ENFORCEMENT (H1, architect ruling 2026-07-17): the floors listed
    # in --enforce-floors below FAIL this job on breach — they are floors the
    # AI already clears, locked against silent regression the moment they were
    # earned. Floors NOT yet listed (the N-track's live targets, e.g. M2/M3/M4
    # during the Wave-2 chase) print as ⚠ advisory in the summary and never
    # red the lane — a hard-red lane on known-open targets just teaches
    # everyone to ignore it.
    # >>> THE RATCHET RULE: when the N-track clears a floor (the sim-runner
    # >>> confirms the canonical median over its threshold), ADD its id to
    # >>> --enforce-floors IN THE SAME COMMIT as that change's golden
    # >>> re-record — each earned floor becomes permanent immediately.
    # M3-pop RE-RATCHETED (2026-07-26, the W6 slice-1 marker commit): the
    # build-doctrine + garrison-discipline arc lands the 25-seed canonical
    # median at 62 (floor 22) — confirmed by the architect's fallback sweep
    # (23 clean + 2 checker-gap false-fails re-verified clean). The 2026-07-25
    # de-ratchet (river baseline 20) is closed.
    runs-on: ubuntu-latest
    # 150, raised from 45 on 2026-08-15. Measured, not waved: this job has been
    # KILLED at the 45-min wire every night since at least 2026-08-09 — the
    # W6-W8 density growth (the same measured cause that took the soak job
    # 45→120 on 2026-08-03) puts canonical seeds at 1.4-2.9 s/turn; the
    # 2026-08-15 run completed 8 of 25 seeds in 45 min (~5.1 min/seed with the
    # runner's 2-way parallelism), so the full 25 need ~130 min. NOT sharded:
    # the M-floors are defined on the 25-seed canonical MEDIAN — per-shard
    # medians are the thin-sample noise the naval arc already paid for.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Canonical soak — 7-civ medium no-chaos, M-target floors (RATCHET enforcing; A93/H1)
        run: |
          set +e
          node tools/soak.js --seeds 25 --turns 400 --civs 7 --size medium --no-chaos \
            --enforce-floors M2-cities,M3-pop,M4-impr,M10-buys,M10-treasury,M-resourceCov \
            --stats debugging/sim/nightly-canonical.jsonl 2>&1 | tee /tmp/canonical-soak.log
          rc=${PIPESTATUS[0]}
          {
            echo '### M-target floors — canonical 7-civ medium no-chaos @ t401 (docs/05 §12)'
            echo '```'
            grep -A8 'M-target floors @' /tmp/canonical-soak.log || echo '(no floor block — see the step log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Upload canonical telemetry + failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-canonical
          path: debugging/sim/
          if-no-files-found: ignore

  ui-lane:
    # A49: the multi-client Playwright UI lane (test-ui/) — real two-context
    # live-socket flows that raw CDP could not hold. Its OWN job so
    # `node --test test/` stays playwright-free; the config drives SwiftShader
    # (no GPU on the runner). Failures upload traces + the HTML report.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install the Playwright chromium browser
        run: npx playwright install --with-deps chromium
      - name: Multi-client UI lane (npx playwright test)
        run: npx playwright test
      - name: Upload Playwright traces + report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
