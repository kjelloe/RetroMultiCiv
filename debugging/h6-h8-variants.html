<h1>H6–H8 variants (spec §4b; High tier only, Low/Medium byte-untouched)</h1>

<h2>H6 — high-detail animals (horse + deer close; all four animals + wagon oxen follow the pick)</h2>
<div class="row">
<figure><img src="h6-anim-a.png" alt="A"><figcaption class="prov">A — anatomical (IN TREE): natural proportions, jointed legs, full antler racks</figcaption></figure>
<figure><img src="h6-anim-b.png" alt="B"><figcaption>B — chunky-stylized: rounder, fatter bodies — friendlier, more toy-like</figcaption></figure>
<figure><img src="h6-anim-c.png" alt="C"><figcaption>C — tall-elegant: longer legs, slimmer bodies — most graceful, thinnest at distance</figcaption></figure>
</div>

<h2>H7 — rounded-R15 figures (militia/legion/cavalry row)</h2>
<div class="row">
<figure><img src="h7-fig-a.png" alt="A"><figcaption class="prov">A — game proportions (IN TREE): balanced torso and head, reads human at map scale</figcaption></figure>
<figure><img src="h7-fig-b.png" alt="B"><figcaption>B — stocky Roblox-ish: bigger head, wider torso — closest nod to the Roblox sibling</figcaption></figure>
<figure><img src="h7-fig-c.png" alt="C"><figcaption>C — slender: narrower torso, smaller head — most realistic silhouette</figcaption></figure>
</div>

<h2>H8 — outer-house facades (faction capital close)</h2>
<div class="row">
<figure><img src="h8-house-a.png" alt="A"><figcaption class="prov">A — mixed storeys (IN TREE): every other outer house two-storey; frames, doors, lintels, steps on all outer</figcaption></figure>
<figure><img src="h8-house-b.png" alt="B"><figcaption>B — all two-storey outer ring: tallest, most townlike</figcaption></figure>
<figure><img src="h8-house-c.png" alt="C"><figcaption>C — single-storey + full kit: lowest profile, closest to the shipped scale</figcaption></figure>
</div>
