<h1>H3 variants — the High house kit (spec §4b; a faction capital, close)</h1>
<p>All three share: houses face the city center, gable ridge roofs on
peaked eras (industrial keeps flat+smokestacks, modern slab+rooftop units),
rampart walls with towers replace the torus when City Walls is built.</p>
<div class="row">
<figure><img src="h3-style-a.png" alt="A"><figcaption class="prov">A — lived-in (PROVISIONAL): chimneys, window pair per house, a door on every third</figcaption></figure>
<figure><img src="h3-style-b.png" alt="B"><figcaption>B — minimal: no chimneys or rooftop kit, windows only — cleanest silhouettes</figcaption></figure>
<figure><img src="h3-style-c.png" alt="C"><figcaption>C — busy: window triple + a door on every house — richest, most cluttered</figcaption></figure>
